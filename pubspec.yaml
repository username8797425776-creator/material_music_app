name: material_music_app
description: Material 3 Android music app with YouTube, lyrics, and SponsorBlock integrations.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.2
  just_audio: ^0.10.6
  audio_service: ^0.18.19
  hive_flutter: ^1.1.0
  path_provider: ^2.1.0
  youtube_explode_dart: ^3.1.0
  intl: ^0.19.0

  # Optional for Material 3 on Android.
  material_color_utilities: ^0.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
